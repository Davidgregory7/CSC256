<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Player Setup</title>
    <link rel="stylesheet" href="main3.css">
</head>

<body>

    <div class="container">
        <h1>Game Player Setup</h1>
        <p>Enter your player information before starting the game.</p>

        <form id="gameForm">

            <label for="username">User Name:</label>
            <input type="text" id="username" required>

            <label for="weapons">Weapons:</label>
            <input type="text" id="weapons" required>

            <label for="health">Health/Damage:</label>
            <input type="number" id="health" required>

            <label for="points">Point Total:</label>
            <input type="number" id="points" required>

            <button type="submit">Submit</button>

        </form>

        <div id="output">
            <h2>Player Information</h2>

            <p><strong>User Name:</strong> <span id="outputUsername"></span></p>
            <p><strong>Weapons:</strong> <span id="outputWeapons"></span></p>
            <p><strong>Health/Damage:</strong> <span id="outputHealth"></span></p>
            <p><strong>Point Total:</strong> <span id="outputPoints"></span></p>
        </div>
    </div>

    <!-- Connect to script3.js -->
    <script src="script3.js"></script>

</body>
</html>
